# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "downloadgenbank"
description: Download a GenBank flatfile from a URL using curl.
keywords:
  - genbank
  - sequence-retrieval
  - curl
  - genomics
tools:
  - "curl":
      description: "Command-line tool for transferring data using URLs."
      homepage: "https://curl.se/"
      documentation: "https://curl.se/docs/"
      tool_dev_url: "https://github.com/curl/curl"
      doi: null
      licence: "curl license (MIT/X derivative)"
      identifier: null

input:
  - download_url:
      type: string
      description: URL of the GenBank flatfile to download.
output:
  genbank_file:
    - "*":
        type: file
        description: Downloaded GenBank flatfile.
        pattern: "*.gb"
        ontologies:
          - edam: "format_1936"
  versions_downloadgenbank:
    - - ${task.process}:
          type: string
          description: The name of the process
      - curl:
          type: string
          description: The name of the tool
      - curl --version | sed "1!d; s/^curl //; s/ .*//":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - curl:
          type: string
          description: The name of the tool
      - curl --version | sed "1!d; s/^curl //; s/ .*//":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@UdoGi"
maintainers:
  - "@UdoGi"
