repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/pr-comment.yml
    - .github/workflows/linting.yml
    - .github/.dockstore.yml
    - .prettierignore
    - docs/CONTRIBUTING.md
    - LICENSE
    - .prettierignore
    - assets/sendmail_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-norotracer_logo_light.png
    - docs/images/nf-core-norotracer_logo_light.png
    - docs/images/nf-core-norotracer_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CITATIONS.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/.dockstore.yml
    - docs/CONTRIBUTING.md
    - CHANGELOG.md
    - LICENSE
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - assets/multiqc_config.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-norotracer_logo_light.png
    - docs/images/nf-core-norotracer_logo_light.png
    - docs/images/nf-core-norotracer_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  readme:
    - nextflow_badge
    - nextflow_badge
    - nfcore_template_badge

template:
  org: the-foxlab
  name: NoroTracer
  description: Nextflow workflow for genomic surveillance and transmission-chain analysis
    of norovirus sequencing data.
  author: Udo Gieraths
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github
    - github_badges
    - changelog
    - license
    - igenomes
    - multiqc
    - fastqc
    - seqera_platform
    - gpu
    - codespaces
    - vscode
    - citations
    - rocrate
    - email
  is_nfcore: false
