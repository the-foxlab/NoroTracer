name: Pipeline tests

on:
  pull_request:
  push:
    branches:
      main:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  # Replace these with the exact tags you pushed to GHCR.
  GB2SEQ_RUNTIME_IMAGE: ghcr.io/udogi/gb2seq-env:0.1.0-runtime@sha256:d791ac341727c4c8934be1921481f5e8eb4fe31f95688bf25c7f416abc8ff768
  GB2SEQ_TEST_IMAGE: ghcr.io/udogi/gb2seq-env:0.1.0-dev@sha256:1ba2a73e3fde572d7e2986f647a7b78f1b9288c4a0a13f7c8636c4a303f1f2ba

  jobs:
  gb2seq-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v6

      # Works for a private package when this repository has package read access.
      # Also works when the package is public.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull test image
        run: docker pull "$GB2SEQ_TEST_IMAGE"

      - name: Run Python unit tests
        run: |
          docker run --rm \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e PYTHONPATH=/workspace/bin \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            "$GB2SEQ_TEST_IMAGE" \
            python -m pytest -q -p no:cacheprovider tests

      - name: Check runtime image
        run: |
          docker run --rm "$GB2SEQ_RUNTIME_IMAGE" \
            python -c 'import gb2seq, pandas'
          docker run --rm "$GB2SEQ_RUNTIME_IMAGE" mafft --version

