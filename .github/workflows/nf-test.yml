name: Run nf-test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NFT_VER: "0.9.4"
  NFT_WORKDIR: "~"
  NXF_ANSI_LOG: false

jobs:
  nf-test:
    name: nf-test | docker | Nextflow ${{ matrix.NXF_VER }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        NXF_VER:
          - "26.04.0"
          - "latest-everything"
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: ${{ matrix.NXF_VER }}

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v2
        with:
          version: ${{ env.NFT_VER }}
          install-pdiff: true

      - name: Run nf-test
        continue-on-error: ${{ matrix.NXF_VER == 'latest-everything' }}
        run: |
          nf-test test modules/ tests/nf_test/main.nf.test \
            --profile=+docker \
            --ci \
            --verbose \
            --tap=test.tap
